name: Generate bilingual reading content

on:
  workflow_dispatch:
  schedule:
    - cron: '15 2 * * 1'

permissions:
  contents: write

jobs:
  generate-reading:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate reading content
        env:
          READING_AI_API_KEY: ${{ secrets.READING_AI_API_KEY }}
          READING_AI_PROVIDER: ${{ vars.READING_AI_PROVIDER }}
          READING_AI_ENDPOINT: ${{ vars.READING_AI_ENDPOINT }}
          READING_AI_MODEL: ${{ vars.READING_AI_MODEL }}
          READING_AI_EXTRA_HEADERS_JSON: ${{ vars.READING_AI_EXTRA_HEADERS_JSON }}
          READING_GUARDIAN_KEY: ${{ secrets.READING_GUARDIAN_KEY }}
          READING_NEWSAPI_KEY: ${{ secrets.READING_NEWSAPI_KEY }}
        run: npm run generate:reading

      - name: Commit generated content
        run: |
          if git diff --quiet -- src/data/generatedReading.ts public/data/generated-reading.json; then
            echo "No content changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/generatedReading.ts public/data/generated-reading.json
          git commit -m "chore: refresh generated reading content"
          git push origin HEAD:${{ github.ref_name }}
